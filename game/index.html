<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEONIDA HEAT — top-down open-world crime game</title>
<meta name="description" content="LEONIDA HEAT — a top-down 2D GTA-style game. Steal it. Drive it. Lose the heat. Six missions, taxi fares and a package hunt across the city of Leonida.">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0c0e13; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #shot-errors { display: none; }
</style>
</head>
<body>
<canvas id="game" aria-label="LEONIDA HEAT: a top-down open-world crime game. Steal cars, outrun the police, finish the six missions."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<div id="shot-errors"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
